<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dark Pinterest Gallery Pro</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0b0b;
    color:white;
}

header{
    padding:16px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

input{
    width:90%;
    max-width:520px;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    margin:10px auto;
    display:block;
    background:#1a1a1a;
    color:black;
}

#gallery{
    column-count:4;
    column-gap:12px;
    padding:15px;
}

@media(max-width:1000px){#gallery{column-count:3;}}
@media(max-width:700px){#gallery{column-count:2;}}
@media(max-width:450px){#gallery{column-count:1;}}

.card{
    break-inside:avoid;
    margin-bottom:12px;
    background:#151515;
    border-radius:12px;
    overflow:hidden;
    transition:0.2s;
}
.card:hover{transform:scale(1.02);}

.img-container{
    position:relative;
    background:#151515;
    width:100%;
}

.card img{
    width:100%;
    display:block;
    opacity:0;
    transition:opacity 0.4s ease;
}

.skeleton{
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,#222,#333,#222);
    background-size:200% 100%;
    animation:shimmer 1.2s infinite;
}

@keyframes shimmer{
    0%{background-position:-200% 0;}
    100%{background-position:200% 0;}
}

.caption{
    padding:8px 10px;
    font-size:13px;
    color:#bbb;
}

.actions{
    display:flex;
    justify-content:space-between;
    padding:8px;
}

button{
    border:none;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    background:#2a2a2a;
    color:white;
}
button:hover{background:#3a3a3a;}

/* Masonry Layout Error Message Fixed */
.no-results {
    column-span: all; 
    text-align: center;
    padding: 40px;
    color: #666;
    font-size: 16px;
}

#toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    padding:10px 14px;
    border-radius:8px;
    opacity:0;
    transition:0.3s;
    z-index:1000;
}
#toast.show{opacity:1;}
</style>
</head>

<body>

<header>🌑 Dark Pinterest Sticker Gallery Pro</header>
<input id="search" placeholder="Search stickers..."/>

<div id="gallery"></div>
<div id="toast">Copied!</div>

<script>
const gallery = document.getElementById("gallery");
const search = document.getElementById("search");
const toast = document.getElementById("toast");

const keywords = [
  "anime goth","cyberpunk","dark anime",
  "cute ghost","goth girl","neon character",
  "witch anime","chibi dark"
];

let data = [];
let filtered = [];
let index = 0;
const batch = 15;

/* DATA GENERATION */
for(let i=1;i<=200;i++){
    const k = keywords[i % keywords.length];
    const height = 400 + (i % 3) * 100;
    const width = 300; 

    data.push({
        img:`https://picsum.photos{width}/${height}?random=${i}`,
        name:`${k} #${i}`,
        width: width,
        height: height
    });
}

filtered = [...data];

/* TOAST CONTROLLER */
let toastTimeout;
function showToast(text="Copied!"){
    clearTimeout(toastTimeout);
    toast.textContent = text;
    toast.classList.add("show");
    toastTimeout = setTimeout(()=>toast.classList.remove("show"),1200);
}

/* IMAGE LAZY LOAD OBSERVER */
const imgObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const img = entry.target;
        if(img.dataset.src && img.src !== img.dataset.src) {
            img.src = img.dataset.src;
            imgObserver.unobserve(img);
        }
    });
}, { rootMargin: "200px" }); // স্ক্রিনে আসার ২০০px আগেই লোড শুরু হবে (Better UX)

/* CARD CREATION */
function createCard(item){
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="img-container" style="aspect-ratio: ${item.width} / ${item.height};">
            <div class="skeleton"></div>
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
                 data-src="${item.img}" alt="${item.name}">
        </div>
        <div class="caption">${item.name}</div>
        <div class="actions">
            <button class="copy">Copy</button>
            <button class="download">Download</button>
        </div>
    `;

    const img = card.querySelector("img");
    const skeleton = card.querySelector(".skeleton");

    imgObserver.observe(img);

    img.onload = () => {
        if (img.src.startsWith('data:')) return;
        skeleton.style.display = "none";
        img.style.opacity = 1;
    };

    img.onerror = () => {
        skeleton.style.display = "none";
        img.src = "https://placeholder.com";
        img.style.opacity = 1;
    };

    /* COPY URL */
    card.querySelector(".copy").onclick = () => {
        navigator.clipboard.writeText(item.img)
            .then(()=>showToast("Image URL copied"))
            .catch(()=>showToast("Copy failed"));
    };

    /* CORS-SAFE DOWNLOAD */
    let downloading = false;
    card.querySelector(".download").onclick = async () => {
        if(downloading) return;
        downloading = true;

        try{
            showToast("Downloading...");
            const res = await fetch(item.img);
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = item.name.replace(/\s+/g,'_') + ".jpg";
            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(url);
        }catch(e){
            window.open(item.img,'_blank');
        }
        downloading = false;
    };

    return card;
}

/* LOAD BATCH */
function loadMore(){
    if(index >= filtered.length) return;

    const fragment = document.createDocumentFragment();
    const slice = filtered.slice(index, index + batch);

    slice.forEach(item=>{
        fragment.appendChild(createCard(item));
    });

    gallery.appendChild(fragment);
    index += batch;
}

/* INFINITE SCROLL SENTINEL */
const sentinel = document.createElement("div");
sentinel.style.height = "10px";
gallery.after(sentinel);

new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting && index < filtered.length){
        loadMore();
    }
}, { rootMargin: "100px" }).observe(sentinel);

/* SEARCH WITH DEBOUNCE */
let t;
search.addEventListener("input", ()=>{
    clearTimeout(t);

    t = setTimeout(()=>{
        const val = search.value.toLowerCase().trim();
        filtered = data.filter(d => d.name.toLowerCase().includes(val));

        gallery.innerHTML = "";
        index = 0;

        if(filtered.length === 0){
            gallery.innerHTML = `<div class="no-results">No stickers found</div>`;
            return;
        }

        loadMore();
    },200);
});

/* INIT */
loadMore();
</script>

</body>
</html>
